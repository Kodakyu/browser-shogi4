kind = "web"
previewPath = "/"
title = "将棋ゲーム"
version = "1.0.0"
id = "artifacts/shogi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22929

[services.development]
run = "pnpm --filter @workspace/shogi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shogi", "run", "build" ]
publicDir = "artifacts/shogi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22929"
BASE_PATH = "/"
